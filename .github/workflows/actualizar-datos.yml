name: Actualizar datos de Quiniela

on:
  schedule:
    # Lunes y jueves a las 06:00 UTC (08:00 hora peninsular en horario de verano).
    # Ajusta si prefieres otra cadencia — cada ejecución gasta muy pocas peticiones.
    - cron: '0 6 * * 1,4'
  workflow_dispatch: {}   # permite lanzarlo a mano desde la pestaña "Actions" de GitHub

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Descargar datos de API-Football
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: node scripts/fetch-data.js

      - name: Publicar cambios si los hay
        run: |
          git config user.name "quiniela-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/resultados.json data/proximos.json
          git diff --cached --quiet || git commit -m "Actualizar datos de jornada [automático]"
          git push
